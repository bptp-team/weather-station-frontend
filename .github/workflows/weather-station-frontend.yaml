name: Weather Station Frontend CI/CD

on:
  push:
    branches: ["main"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: weather-station-frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: make install

      - name: Run lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Build app
        run: make build

      - name: Run tests
        run: make test

      - name: Set up Buildx
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/setup-buildx-action@v3

      # On a tag the publish job builds the image that gets pushed, so this build is skipped.
      - name: Build image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.FRONTEND_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A Basic registry cannot lock tags, so a published version is protected here.
      # "Not found" is the expected outcome, and it makes this step pass.
      - name: Refuse a version that already exists
        run: "! az acr repository show --name ${{ vars.ACR_NAME }} --image ${{ env.IMAGE_NAME }}:${{ github.ref_name }} --output none"

      - name: Sign in to the registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # No VITE_WEATHER_API_URL: the empty default keeps the API calls relative,
      # so the same image works behind any domain served by the edge proxy.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.FRONTEND_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Run Command reaches the VM through the Azure API, so port 22 stays closed to runners.
      # The deploy script lives on the VM, provisioned by the platform repository.
      - name: Deploy ${{ needs.publish.outputs.image }}
        run: >-
          az vm run-command invoke
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --name ${{ vars.AZURE_VM_NAME }}
          --command-id RunShellScript
          --scripts "${{ vars.DEPLOY_SCRIPT }} frontend ${{ github.ref_name }}"
          --query "value[0].message" --output tsv

      - name: Verify the page answers in production
        run: curl --fail --silent --show-error --max-time 30 https://${{ vars.PUBLIC_FQDN }}/healthz
